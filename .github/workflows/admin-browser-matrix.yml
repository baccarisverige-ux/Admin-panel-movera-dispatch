name: Admin browser acceptance evidence
# CI cost cut (owner 2026-11-06): the multi-browser run (Chromium, Firefox,
# WebKit) runs only with the label `ready-to-merge` on a pull request (adding
# the label starts it; every later push while the label is on runs it again),
# on pushes to main, or manually. The fast Chromium e2e runs on every push in
# webapp-ci.yml. (Before: it ran only for two old branches, r17 and r18.)
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches: [main, admin/r17-dashboard-reports, admin/r18-quality]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      grep:
        description: 'Optional: run only the tests whose title matches (Playwright --grep). Empty runs all.'
        required: false
        default: ''
concurrency:
  # Adding some other label does not cancel a running matrix.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'ready-to-merge') && github.event.label.name || 'run' }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browsers:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft != true &&
       contains(github.event.pull_request.labels.*.name, 'ready-to-merge') &&
       (github.event.action != 'labeled' || github.event.label.name == 'ready-to-merge'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: xvfb-run --auto-servernum npx playwright test --config playwright.matrix.config.ts ${GREP:+--grep "$GREP"}
        env:
          GREP: ${{ github.event.inputs.grep || '' }}
          LIBGL_ALWAYS_SOFTWARE: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-browser-evidence
          path: |
            webapp/playwright-report
            webapp/test-results
