name: Admin browser acceptance evidence
on:
  pull_request:
    branches: [admin/r17-dashboard-reports, admin/r18-quality]
  workflow_dispatch:
concurrency:
  group: admin-browser-matrix-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: xvfb-run --auto-servernum npx playwright test --config playwright.matrix.config.ts
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-browser-evidence
          path: |
            webapp/playwright-report
            webapp/test-results
