name: Webapp checks
# The required gate for main. pages.yml deploys only after this workflow succeeds on a push to main.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["main"]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push cancels the older run of the same workflow on the same ref
  # (pull request refs and branch refs are different groups).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: webapp

jobs:
  # CI cost cut (owner 2026-11-06): docs-only pull requests and drafts skip the
  # heavy jobs. paths-ignore is not used on pull_request here because the
  # required checks would then never report and the PR would wait forever; a
  # skipped job reports as passed, so branch protection still works.
  changes:
    name: Detect docs-only change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')"
          # Any file that is not *.md and not under docs/ counts as code.
          if [ -z "$files" ] || printf '%s\n' "$files" | grep -qvE '(\.md$|^docs/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          echo "$files"

  checks:
    name: typecheck, lint, unit tests, build
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Lint (fails on any error and on any warning above the documented baseline)
        run: npm run lint:ci
      - name: Unit tests
        run: npm test
      - name: Build
        run: npx vite build
      - name: First-load size budget (audit Phase 7)
        run: node scripts/check-bundle.mjs dist

  audit:
    name: npm audit (production dependencies, high and above)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source /repo --redact --no-banner --exit-code 1

  # B15 (faster CI): the e2e suite (9 min in one job) runs in two parallel
  # shards; the job named "Playwright e2e" (the old check name) passes only
  # when both shards passed.
  e2e-shard:
    name: Playwright e2e (shard ${{ matrix.shard }}/2)
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('webapp/package-lock.json') }}
      # Installs the Chromium build that matches the pinned @playwright/test version.
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run e2e -- --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report-${{ matrix.shard }}
          path: |
            webapp/playwright-report
            webapp/test-results
          retention-days: 7

  e2e:
    name: Playwright e2e
    if: always()
    needs: [changes, e2e-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Both shards passed
        # CI cost cut (owner 2026-11-06): the shards are skipped on purpose on
        # drafts and docs-only changes; then a skip passes. changes must pass.
        working-directory: .
        env:
          CHANGES: ${{ needs.changes.result }}
          SHARDS: ${{ needs.e2e-shard.result }}
          SKIP_OK: ${{ needs.changes.outputs.code != 'true' || github.event.pull_request.draft == true }}
        run: |
          echo "changes=$CHANGES shards=$SHARDS planned-skip=$SKIP_OK"
          test "$CHANGES" = success
          test "$SHARDS" = success || { test "$SHARDS" = skipped && test "$SKIP_OK" = true; }

  e2e-live:
    name: Playwright e2e (live, faked server)
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('webapp/package-lock.json') }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run e2e:live
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-live-report
          path: |
            webapp/playwright-report
            webapp/test-results
          retention-days: 7

  # Step 45 (2026-11-09, plan U5 prep): one job that is always there and green
  # only when every job of this workflow passed or was skipped on purpose, so a
  # branch ruleset can require exactly one check name ("gate"). changes, audit
  # and secrets must always pass; e2e is the two shards' own aggregate; the
  # other jobs may be skipped only on a draft or a docs-only change (CI cost
  # cut, owner 2026-11-06). Same rule as the rider app's gate.
  gate:
    name: gate
    if: always()
    needs: [changes, checks, audit, secrets, e2e, e2e-live]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed on this commit
        working-directory: .
        env:
          RESULTS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
          DRAFT: ${{ github.event.pull_request.draft == true }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | python3 -c '
          import json, os, sys
          needs = {k: v["result"] for k, v in json.load(sys.stdin).items()}
          skip_all = os.environ["CODE"] != "true" or os.environ["DRAFT"] == "true"
          ok = bool(needs)
          for job, result in needs.items():
              if result == "success":
                  continue
              planned = result == "skipped" and job not in ("changes", "audit", "secrets") and skip_all
              print(job, result, "planned skip" if planned else "FAIL")
              ok = ok and planned
          sys.exit(0 if ok else 1)
          '
